name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Download official Stockfish Android binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a /tmp/sf_arm64 /tmp/sf_armv7
          if curl -fL --retry 3 -o /tmp/sf_arm64.tar.gz "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-arm64-universal.tar.gz"; then
            tar -xzf /tmp/sf_arm64.tar.gz -C /tmp/sf_arm64
            SF_BIN=$(find /tmp/sf_arm64 -type f -name "stockfish*" ! -name "*.nnue" | head -n 1)
            if [ -n "$SF_BIN" ]; then
              cp "$SF_BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
              chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so
            fi
          fi
          if curl -fL --retry 3 -o /tmp/sf_armv7.tar.gz "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-android-armv7-neon.tar.gz"; then
            tar -xzf /tmp/sf_armv7.tar.gz -C /tmp/sf_armv7
            SF_BIN=$(find /tmp/sf_armv7 -type f -name "stockfish*" ! -name "*.nnue" | head -n 1)
            if [ -n "$SF_BIN" ]; then
              cp "$SF_BIN" app/src/main/jniLibs/armeabi-v7a/libstockfish.so
              chmod 755 app/src/main/jniLibs/armeabi-v7a/libstockfish.so
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
